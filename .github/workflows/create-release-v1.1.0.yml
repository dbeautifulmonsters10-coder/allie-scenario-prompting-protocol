name: Create v1.1.0 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create v1.1.0 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/release-notes.md << 'RELEASE_NOTES'
          ## Overview

          The **Allie Scenario Prompting Protocol (ASPP)** is a scenario-constrained, outcome-first prompt engineering methodology created by **Darren L. Allie, Director of AI Workflow Optimization and AI Business Improvement, Azure & Verdant Vistas, LLC**.

          ASPP formalizes scenario-based prompting into a structured decision-support protocol designed to guide AI and large language model systems toward **one best actionable output** through scenario analysis, constraint recognition, decision narrowing, logical reasoning, and executable action planning.

          ---

          ## What's New in v1.1

          - **Enhanced protocol specification language** for clarity and consistency.
          - **Updated S.C.E.N.A.R.I.O. framework** with v1.1 naming and metadata across all documents.
          - **Updated template library and benchmark/rubric files** to v1.1 naming and metadata.
          - **Renamed preprint manuscript source files** to v1.1 (`.tex` and `.docx`) and updated version text.
          - **Refreshed citation and abstract metadata** for the v1.1 public release.

          ---

          ## Package Contents

          This release includes the following v1.1 artifacts:

          ```
          release/ASPP_Preprint_v1_1.tex
          release/ASPP_Preprint_v1_1.docx
          release/ASPP_Preprint_Zenodo_Ready_v1_1_DOI.pdf
          docs/ASPP_Specification_v1_1.md
          docs/ASPP_SCENARIO_Framework_v1_1.md
          templates/ASPP_Template_Library_v1_1.md
          benchmarks/ASPP_Bench_Evaluation_Dataset_v1_1.md
          benchmarks/ASPP_Evaluation_Rubric_v1_1.md
          release/ASPP_Citation_Metadata.txt
          release/ASPP_Abstract_and_Metadata.txt
          release/references.bib
          release/ZENODO_UPLOAD_CHECKLIST.md
          assets/figures.zip
          LICENSE_CC_BY_4_0.txt
          README.md
          ```

          ---

          ## Official Citation

          Allie, Darren L. (2026). *The Allie Scenario Prompting Protocol: A Scenario-Constrained, Outcome-First Method for Prompt Engineering.* Azure & Verdant Vistas, LLC. DOI: [10.5281/zenodo.20596641](https://doi.org/10.5281/zenodo.20596641)

          **DOI:** `10.5281/zenodo.20596641`

          ---

          ## Version History

          | Version | Description |
          |---|---|
          | **v1.1.0** | Public release update — updated protocol/specification language, v1.1 S.C.E.N.A.R.I.O. framework, benchmark/rubric refresh, manuscript filename/version updates, refreshed citation and abstract metadata. |
          | v1.0.0 | Initial Public Release — preserved, unchanged. |

          > **Note:** The prior release `v1.0.0` (*ASPP v1.0.0 — Initial Public Release*) remains available and preserved in the [Releases](https://github.com/dbeautifulmonsters10-coder/allie-scenario-prompting-protocol/releases/tag/v1.0.0) page.

          ---

          **Full Changelog:** https://github.com/dbeautifulmonsters10-coder/allie-scenario-prompting-protocol/commits/v1.1.0
          RELEASE_NOTES

          gh release create v1.1.0 \
            --title "ASPP v1.1.0 — Public Release Update" \
            --notes-file /tmp/release-notes.md \
            --target main
